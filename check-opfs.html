<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>アプリ内保存の確認</title>
<style>
  :root { --bg:#fff; --fg:#111; --sub:#666; --acc:#0a66c2; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --sub:#999; --acc:#5aa9ff; --line:#333; } }
  body { margin: 0 auto; padding: 16px; max-width: 640px; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, system-ui, sans-serif; }
  button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--acc); background: var(--acc); color: #fff; margin: 4px 4px 4px 0; }
  button.sub { background: transparent; color: var(--acc); }
  .muted { color: var(--sub); font-size: 14px; }
  progress { width: 100%; }
  li { margin: 6px 0; padding-bottom: 6px; border-bottom: 1px solid var(--line); list-style: none; }
  ul { padding: 0; }
  video { width: 100%; background: #000; border-radius: 6px; margin-top: 8px; }
</style>
</head>
<body>
<h1 style="font-size:18px">アプリ内保存（OPFS）の確認</h1>
<p class="muted">① ホーム画面に追加して開く ② 動画を保存 ③ アプリを閉じて数日後に開き、一覧に残っていて再生できるか確認</p>
<div id="env" class="muted"></div>
<p><button class="sub" id="persist">消されにくくする（persist）</button></p>
<p><input type="file" id="file" accept="video/*"></p>
<progress id="prog" value="0" max="1"></progress>
<p id="log"></p>
<h2 style="font-size:16px">保存済み</h2>
<ul id="list"></ul>
<video id="video" playsinline controls></video>
<script>
const $ = (id) => document.getElementById(id);
const log = (t) => { $('log').textContent = t; };
const MB = (n) => (n / 1e6).toFixed(0) + ' MB';

async function env() {
  const st = navigator.storage, standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let t = `ホーム画面から起動: ${standalone ? 'はい' : 'いいえ'}　`;
  if (!st || !st.getDirectory) { $('env').textContent = t + 'OPFS: ❌ 未対応'; return; }
  const est = st.estimate ? await st.estimate() : {};
  const persisted = st.persisted ? await st.persisted() : '不明';
  $('env').textContent = t + `使用 ${MB(est.usage || 0)} / 上限 ${MB(est.quota || 0)}　persist: ${persisted}`;
}

$('persist').onclick = async () => {
  if (!navigator.storage || !navigator.storage.persist) { log('persist 未対応'); return; }
  log('persist: ' + await navigator.storage.persist()); env();
};

$('file').onchange = () => {
  const file = $('file').files[0]; if (!file) return;
  const w = new Worker('check-opfs-worker.js');
  log(`保存中… ${file.name}`);
  w.onmessage = (e) => {
    const m = e.data;
    if (m.type === 'progress') { $('prog').max = m.total; $('prog').value = m.done; }
    else if (m.type === 'done') { log(`✅ 保存しました（${MB(file.size)}、${(m.ms / 1000).toFixed(1)} 秒）`); w.terminate(); refresh(); }
    else if (m.type === 'error') { log('❌ ' + m.message); w.terminate(); refresh(); }
  };
  w.postMessage({ file });
};

async function refresh() {
  env();
  if (!navigator.storage || !navigator.storage.getDirectory) return;
  const root = await navigator.storage.getDirectory(), items = [];
  for await (const [name, h] of root.entries()) if (h.kind === 'file') items.push([name, await h.getFile()]);
  $('list').innerHTML = items.length ? '' : '<li class="muted">なし</li>';
  for (const [name, f] of items) {
    const li = document.createElement('li');
    li.innerHTML = `${name}<br><span class="muted">${MB(f.size)}　保存 ${new Date(f.lastModified).toLocaleString()}</span><br>`;
    const play = document.createElement('button'); play.textContent = '再生';
    play.onclick = () => { $('video').src = URL.createObjectURL(f); $('video').play(); };
    const del = document.createElement('button'); del.textContent = '削除'; del.className = 'sub';
    del.onclick = async () => { await root.removeEntry(name); refresh(); };
    li.append(play, del); $('list').append(li);
  }
}
refresh();
</script>
</body>
</html>
